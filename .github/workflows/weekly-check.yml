name: Weekly source check

# Taipower overwrites the same URL on every update, so a missed version is lost.
# Check weekly (conditional requests: an unchanged file costs one 304), archive
# new versions on main immediately, and open a review PR before they go live.
on:
  schedule:
    - cron: "0 1 * * 1"   # Mondays 09:00 Asia/Taipei
    - cron: "0 1 15 9 *"  # Sep 15: reminder for the new LY budget evaluation report
  workflow_dispatch:
    inputs:
      via_wayback:
        description: "Skip the direct request and check through Wayback (tests the relay used when Taipower is unreachable)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: source-check
  cancel-in-progress: false

jobs:
  ly-reminder:
    if: github.event.schedule == '0 1 15 9 *'
    runs-on: ubuntu-latest
    steps:
      - name: Open reminder issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "檢查立法院預算中心新年度總預算案整體評估報告" \
            --body "每年 9 月立法院預算中心會發布新年度的總預算案整體評估報告。請確認是否有新的「太陽光電等候併網」區處統計表；若有，依 data/curated/README.md 的方式人工擷取、核對，並更新 S04。注意前後年度口徑可能不同（例：114 年度為全部再生能源、11 個區處）。"

  check:
    if: github.event.schedule != '0 1 15 9 *'
    runs-on: ubuntu-latest
    outputs:
      failed: ${{ steps.fetch.outputs.failed }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Check sources
        id: fetch
        env:
          VIA_WAYBACK: ${{ inputs.via_wayback }}
        run: |
          if [ "$VIA_WAYBACK" = "true" ]; then
            uv run python src/ingest/fetch_snapshots.py --via-wayback
          else
            uv run python src/ingest/fetch_snapshots.py
          fi
      - name: Rebuild site data from approved snapshots only
        run: |
          uv run python src/transform/build_counties.py
          uv run python src/transform/build_queue.py
      - name: Commit check log and any new raw archive to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data web docs
          if ! git diff --cached --quiet; then
            git commit -m "Source check $(date -u +%Y-%m-%d)"
            git push
          fi
      # Driven by the manifest, not by what this run fetched, so a failed attempt is retried
      # by the next check. A closed PR counts as a review decision and is not reopened.
      - name: Open or refresh the review PR for snapshots awaiting approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archived="$(uv run python src/ingest/approve.py --pending)"
          pending="$(printf '%s\n' "$archived" | grep -E '^S0[12]-' | paste -sd ' ' -)"
          if [ -z "$pending" ]; then
            echo "Nothing awaiting approval."
            exit 0
          fi
          branch="data/${pending// /_}"
          state="$(gh pr list --head "$branch" --state all --json state --jq '.[0].state // ""')"
          if [ "$state" = "CLOSED" ] || [ "$state" = "MERGED" ]; then
            echo "$branch was already reviewed ($state); use approve.py to publish it by hand."
            exit 0
          fi
          uv run python src/report/summarize_change.py > "$RUNNER_TEMP/pr_body.md"
          git switch -c "$branch"
          uv run python src/ingest/approve.py $pending
          uv run python src/transform/build_counties.py
          uv run python src/transform/build_queue.py
          git add data web docs
          git commit -m "Publish $pending"
          # Rebuilt from main every week, so an open PR never conflicts with the weekly check commits.
          git push --force -u origin "$branch"
          if [ "$state" != "OPEN" ]; then
            gh pr create --base main --head "$branch" \
              --title "新版資料待審：$pending" --body-file "$RUNNER_TEMP/pr_body.md"
          fi

  deploy:
    needs: check
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml

  # A source that could be reached neither directly nor through a fresh Wayback capture
  # still gets its check log committed and the site deployed; this job then turns the run
  # red, so a week in which nothing was really checked does not look like a quiet week.
  alert:
    needs: [check, deploy]
    if: ${{ !cancelled() && needs.check.outputs.failed != '' }}
    runs-on: ubuntu-latest
    steps:
      - env:
          FAILED: ${{ needs.check.outputs.failed }}
        run: |
          echo "::error title=Sources not checked::${FAILED} reached neither Taipower nor a fresh Wayback capture, so a new version may be waiting. Check from a machine that reaches Taipower: fetch_snapshots.py --detect-only (README, 自動更新)."
          exit 1
