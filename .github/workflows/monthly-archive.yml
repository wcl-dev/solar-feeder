name: Monthly source check

# Taipower overwrites the same URL on every update, so check monthly and
# archive any new version. Every run appends to data/manifests/checks.csv,
# which drives the site's "last checked" date.
on:
  schedule:
    - cron: "0 2 1 * *" # 1st of each month, 10:00 Asia/Taipei
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run python src/ingest/fetch_snapshots.py
      - run: uv run python src/transform/build_yunlin.py
      - run: uv run python src/transform/build_queue.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data web docs
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Monthly source check $(date -u +%Y-%m-%d)"
            git push
          fi

  deploy:
    needs: archive
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
